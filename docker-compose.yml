services:
  dock-spring:
    build:
      context: ./dock-spring
      dockerfile: Dockerfile
    container_name: dock-spring
    ports:
      - "8080:8080"
    networks:
      - docker-net
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_DATASOURCE_DRIVER_CLASSNAME=${SPRING_DATASOURCE_DRIVER_CLASSNAME}

  dock-next:
    build:
      context: ./dock-next
      dockerfile: Dockerfile
    container_name: dock-next
    ports:
      - "3000:3000"
    networks:
      - docker-net
    volumes:
      - ./dock-next:/app
      - /app/node_modules
    env_file:
      - ./dock-next/.env.docker
    environment:
      - NODE_ENV=${NODE_ENV}
    command: ${NPM_COMMAND}

networks:
  docker-net:
    driver: bridge